# This workflow uses actions that are not certified by GitHub. They are
# provided by a third party and are governed by separate terms of service,
# privacy policy, and support documentation.
#
# OpenSSF Scorecard — automated security health check for the project.
# Adapted from the official template (see
# https://github.com/ossf/scorecard-action). Schedule is weekly (Monday
# morning) so the score tracks the project over time. Manual dispatch
# available for ad-hoc re-scans.
#
# Triggers:
#   - branch_protection_rule: enables the Branch-Protection check on main.
#   - schedule (weekly): keeps the Maintained check fresh.
#   - push to main: re-scores after each merge.
#   - pull_request: scores the PR branch (path-filtered so doc-only PRs
#     don't move the score).
#   - workflow_dispatch: manual re-scan.
#
# `on` is quoted as `"on"` to avoid the YAML 1.1 boolean-literal
# gotcha. See ci.yml + lighthouse.yml for the same pattern.

name: OpenSSF Scorecard
"on":
  branch_protection_rule:
  schedule:
    - cron: "43 12 * * 6"
  push:
    branches: [main]
  pull_request:
    # Doc-only and config-only PRs shouldn't move the score — they
    # don't change behavior. Mirrors the cache-buster discipline
    # (cache-strategy.md, Phase 22).
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
  workflow_dispatch:

# Default permissions: read-only. The job below grants the write
# permissions it requires explicitly.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Needed to upload the results to the code-scanning dashboard.
      security-events: write
      # Needed to publish results and get a badge (see publish_results).
      id-token: write
      contents: read
      actions: read
    steps:
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Run analysis"
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Public repos: publish results to OpenSSF REST API for the
          # public Scorecard badge at api.scorecard.dev. For private
          # repos this is always false regardless of the value here.
          publish_results: true

      - name: "Upload artifact"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: "Upload to code-scanning"
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif