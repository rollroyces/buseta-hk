name: Welcome first-time contributors

on:
  pull_request:
    types: [opened]
  issues:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - name: Greet first-time contributor
        uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            👋 Welcome — thanks for opening your first issue on BusETA HK!

            A maintainer will take a look. In the meantime:

            - Check the [README](https://github.com/rollroyces/buseta-hk#readme) for project overview
            - See [CONTRIBUTING.md](https://github.com/rollroyces/buseta-hk/blob/main/CONTRIBUTING.md) for dev setup
            - Browse the [docs/](https://github.com/rollroyces/buseta-hk/tree/main/docs) folder for architecture, deploy, localization, and troubleshooting guides

            For security issues, see [SECURITY.md](https://github.com/rollroyces/buseta-hk/blob/main/SECURITY.md).
          pr-message: |
            👋 Welcome — thanks for your first pull request on BusETA HK!

            A maintainer will review shortly. In the meantime:

            - Make sure `npm run lint && npm test` passes locally
            - Follow the [pull request template](https://github.com/rollroyces/buseta-hk/blob/main/.github/PULL_REQUEST_TEMPLATE.md)
            - Bump `?v=` cache-busters + `buseta-version` + `sw.js` CACHE if you touched `app.js`, `planner.js`, `style.css`, `planner.css`, or `assets/*`
            - Update [CHANGELOG.md](https://github.com/rollroyces/buseta-hk/blob/main/CHANGELOG.md) if the change is user-visible