<style id="critical-css">
/* ============================================================
   Critical CSS (inlined to make the splash paint on first byte)
   This is a hand-picked subset of style.css that covers everything
   visible before the deferred style.min.css loads. It does NOT
   include operator chips / row cards / footer / etc — those are
   in style.min.css and applied once that stylesheet swaps to all.
   ============================================================ */
:root{--bg:#0B1220;--bg-soft:#131C36;--card:#131C36;--ink:#F1F5F9;--ink-2:#CBD5E1;--muted:#94A3B8;--muted-2:#64748B;--line:#1F2A44;--line-2:#1A2440;--accent:#38BDF8;--accent-2:#7DD3FC;--accent-soft:rgba(56,189,248,0.18);--warn:#F59E0B;--danger:#F87171;--dark:#0A1628;--dark-2:#142235;--on-dark:#F8FAFC;--on-dark-muted:#94A3B8;--r-sm:8px;--r-md:14px;--r-lg:20px;--r-pill:999px;--shadow-sm:0 1px 2px rgba(0,0,0,0.32);--shadow-md:0 4px 14px rgba(0,0,0,0.38);--shadow-lg:0 12px 32px rgba(0,0,0,0.48);--tap:-webkit-tap-highlight-color:transparent}
:root[data-theme="light"]{--bg:#FAFAF7;--bg-soft:#F1F2EE;--card:#FFFFFF;--ink:#0F172A;--ink-2:#334155;--muted:#64748B;--muted-2:#94A3B8;--line:#D8DCE2;--line-2:#ECEEF1;--accent:#0284C2;--accent-2:#0369A1;--accent-soft:#E0F2FE;--warn:#B45309;--danger:#B91C1C;--shadow-sm:0 1px 2px rgba(15,23,42,0.06);--shadow-md:0 4px 14px rgba(15,23,42,0.08);--shadow-lg:0 12px 32px rgba(15,23,42,0.12)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","PingFang HK","Microsoft JhengHei","Hiragino Sans CNS","Noto Sans TC","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{min-height:100vh;min-height:100dvh;padding-top:64px;padding-bottom:76px;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}

h1,h2,h3{margin:0;font-weight:700;letter-spacing:-0.01em}
.skip-link{position:absolute;top:-100px;left:8px;background:var(--dark);color:var(--on-dark);padding:8px 12px;border-radius:var(--r-sm);z-index:1000}
.skip-link:focus{top:8px}
.topbar{position:fixed;top:0;left:0;right:0;height:64px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 16px;background:var(--dark);color:var(--on-dark);z-index:50;box-shadow:0 1px 0 rgba(255,255,255,0.04)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;border-radius:9px;background:rgba(255,255,255,0.04)}
.brand-text{display:flex;flex-direction:column;line-height:1.05;min-width:0}
.brand-sub{font-size:11px;color:var(--on-dark-muted);font-weight:500;letter-spacing:0.02em}
.brand-title{font-size:22px;font-weight:800;letter-spacing:-0.02em}
.topbar-right{display:flex;align-items:center;gap:8px}
.clock{font-variant-numeric:tabular-nums;font-weight:700;font-size:16px;letter-spacing:-0.01em;color:var(--on-dark);padding:6px 10px;background:rgba(255,255,255,0.06);border-radius:var(--r-pill)}
.lang-toggle{height:36px;padding:0 14px;border-radius:var(--r-pill);border:1px solid rgba(255,255,255,0.16);color:var(--on-dark);font-weight:700;font-size:13px;letter-spacing:0.02em;transition:background 0.15s ease}
.lang-toggle:hover,.lang-toggle:focus-visible{background:rgba(255,255,255,0.08)}
.lang-toggle:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.splash{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100dvh - 64px - 76px);padding:32px 24px;text-align:center}
.splash-icon{margin-bottom:16px;filter:drop-shadow(0 8px 24px rgba(14,165,233,0.25))}
.splash-title{font-size:36px;font-weight:800;letter-spacing:-0.02em;color:var(--ink)}
.splash-rule{width:40px;height:3px;background:var(--accent);border-radius:3px;margin:10px 0 8px}
.splash-tagline{margin:0 0 28px;color:var(--muted);font-size:14px}
.splash-spinner{width:24px;height:24px;border-radius:50%;border:2.5px solid var(--accent-soft);border-top-color:var(--accent);animation:spin 0.9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.splash-loading{margin:12px 0 0;color:var(--muted);font-size:14px}
.main{min-height:calc(100dvh - 64px - 76px)}
[hidden]{display:none !important}
.view[hidden]{display:none !important}
.container{max-width:720px;margin:0 auto;padding:16px 16px 24px}
.section-title{font-size:17px;font-weight:700;color:var(--ink);margin:20px 0 12px;letter-spacing:-0.01em}
.section-title:first-child{margin-top:8px}
.muted{color:var(--muted);margin:0;font-size:14px}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:var(--r-md);padding:20px 16px;text-align:center;color:var(--muted);font-size:14px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:64px;display:flex;background:rgba(255,255,255,0.94);backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);border-top:1px solid var(--line);z-index:50;padding-bottom:env(safe-area-inset-bottom,0)}
.nav-item{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);font-weight:600;font-size:12px;height:100%;position:relative;transition:color 0.15s ease}
.nav-item:hover{color:var(--ink-2)}
.nav-item.is-active{color:var(--accent-2)}
.nav-icon{display:block}
.nav-rule{position:absolute;left:50%;bottom:8px;width:24px;height:2px;border-radius:2px;background:var(--accent);transform:translateX(-50%) scaleX(0);transform-origin:center;transition:transform 0.18s ease}
.nav-item.is-active .nav-rule{transform:translateX(-50%) scaleX(1)}
</style>
<!-- Main stylesheet. The original style.css is what we ship today — a
     hand-rolled minifier produced a broken style.min.css earlier, so we
     load the unminified bundle directly. v=24 forces cached browsers
     to refetch after Batch 1 of the v11 feature push — service-alerts
     banner on the home view, share button + inline QR on stop/route
     views, and trip planner "depart by HH:MM" mode. -->
<link rel="stylesheet" href="style.css?v=24" />
<script>
/* Theme loader — runs synchronously in <head> so :root[data-theme] is set
   BEFORE the body paints. Mirrors the loadThemePreference() logic in app.js
   but does not need to wait for app.js to download/execute. Without this,
   a light-mode returning visitor would see a dark first-paint flash. */
(function () {
  try {
    var stored = localStorage.getItem('buseta.theme');
    var mode = (stored === 'dark' || stored === 'light' || stored === 'system')
      ? stored : 'system';
    if (mode === 'light') {
      document.documentElement.setAttribute('data-theme', 'light');
    } else if (mode === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
    /* If mode === 'system' or no value at all, leave the data-theme
       attribute unset so prefers-color-scheme drives the choice. The :root
       defaults are dark, so first-time visitors with no preference
       (or no system support) get dark as the fallback. */
    var btn = document.getElementById('themeToggle');
    if (btn) btn.setAttribute('data-mode', mode);
  } catch (e) { /* localStorage unavailable — fall back to dark */ }
})();
</script>
</head>

<script>
/* Lazy planner loader — planner.js + planner.min.css are only fetched the
   first time the user navigates to #/planner. They are cached at the
   module level so subsequent navigations don't refetch. */
window.__buseta = {
  _plannerScript: null,
  _plannerCss: null,
  loadPlannerScript() {
    if (window.Planner) return Promise.resolve(window.Planner);
    if (this._plannerScript) return this._plannerScript;
    this._plannerScript = new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'planner.js?v=15';
      s.async = false; // preserve execution order
      s.onload = () => resolve(window.Planner);
      s.onerror = () => reject(new Error('planner.js failed to load'));
      document.head.appendChild(s);
    });
    return this._plannerScript;
  },
  loadPlannerCss() {
    if (document.querySelector('link[data-planner-css]')) return Promise.resolve();
    if (this._plannerCss) return this._plannerCss;
    this._plannerCss = new Promise((resolve, reject) => {
      const l = document.createElement('link');
      l.rel = 'stylesheet';
      l.href = 'planner.css?v=15';
      l.setAttribute('data-planner-css', '1');
      l.media = 'print';
      l.onload = () => { l.media = 'all'; resolve(); };
      l.onerror = () => reject(new Error('planner.css failed to load'));
      document.head.appendChild(l);
    });
    return this._plannerCss;
  },
};
</script>
