    <!-- Main stylesheet. The original style.css is what we ship today — a
     hand-rolled minifier produced a broken style.min.css earlier, so we
     load the unminified bundle directly. v=35 ships the "show every
     route serving the stop" fix on top of v=34's unresolvable-stop UX:
       - refreshBusStopView now iterates over every entry returned by the
         upstream /stop-eta (KMB) / /batch/stop-eta/CTB/{stop} feeds,
         including rows where `eta === null`. Groups that ended up with
         zero non-null ETAs render a new dimmed `.route-card--no-eta`
         placeholder card so off-peak users see the full route index
         instead of a single lonely card.
       - new buildNoEtaCard(co, route, destTc, destEn, onSchedule)
         helper renders the dimmed card (operator pill + route number +
         TC/EN destination + "暫無到站時間" label + "睇時間表" CTA that
         switches to the Schedule tab). Wired into refreshBusStopView.
       - CTB parity: refreshBusStopView now also fetches
         fetchCitybusBatchStopEta for 6-digit numeric stop IDs (was
         previously a no-op that always showed the empty state). Both
         operators flow through the same groupBy path; CTB's co is
         hardcoded since classifyKmbOp is KMB-only.
       - 3 new i18n keys × 3 locales: stopNoUpcomingEta
         ("暫無到站時間" / "No upcoming buses" / "暂无到站时间"),
         stopNoUpcomingEtaHint, stopNoUpcomingEtaCta.
       - sort: live-ETA cards first (by primary arrival time), then
         no-ETA placeholders alphabetically by route number. locale-
         Compare with numeric: true so "1, 2, 10" reads in human order.
       - new CSS block: .route-card + .route-card--no-eta + .stop-no-
         upcoming-eta + .stop-no-upcoming-eta-hint + .stop-no-upcoming-
         eta-cta appended to style.css as a single v35 section.
       - SW NOT bumped: SHELL pre-cache still ships the same five
         files; the v34 → v35 cycle only touches the user-visible live
         panel so a forced-update is unnecessary. index.html cache-
         buster ?v=34 → ?v=35 on app.js + style.css, meta
         name="buseta-version" content="34" → "35".

     v=36 ships "operator-code → internal-ID resolution" on top of v=35:
       - When the user navigates via a KMB operator-facing stop code
         (e.g. "#/stop/MA973" → 利安巴士總站), the seed lookup captures
         both the resolved name AND the internal 16-hex ID from the
         `kmbOperatorId` reverse map. The internal ID is stored on
         stateRef.internalStopId and used for the ETA fetch in
         refreshBusStopView (KMB upstream returns empty for operator
         codes, only accepts the 16-hex form).
       - buildStopTabs now accepts a third `fetchStopId` parameter so
         the Schedule tab switch also uses the internal ID; schedule
         cache key + renderSchedulePanel call both updated.
       - state._refreshStop({mode:'schedule'}) uses the same resolved
         ID for the cache delete + renderSchedulePanel call, so the
         schedule view goes to upstream with a valid ID too.
       - Bug observed on live: opening "/stop/MA973" resolved the
         heading to 利安巴士總站 correctly but the live panel was
         empty because the upstream fetch used "MA973" instead of
         "0C81107C4ABFCD56". Now both work in sync.
       - SW bumped buseta-v23 → buseta-v24 to force a clean install.
       - index.html cache-buster ?v=35 → ?v=36 on app.js + style.css,
         meta name="buseta-version" content="35" → "36".

     v=37 ships "off-peak routes visible" on top of v=36:
       - The live panel now augments the upstream `/stop-eta` (KMB) /
         `/batch/stop-eta/CTB/{stop}` (CTB) route set with terminus-
         style matches from `state.index.routes`, so routes that serve
         the stop but aren't running right now appear as dimmed
         `.route-card--no-eta` placeholders instead of disappearing.
       - New helper `findTerminusRoutesForStop(stopNameTc)` walks
         `state.index.routes`, strips operator-suffix artefacts from
         both the candidate and the resolved stop name, and returns
         KMB / LWB / CTB / NWFB routes whose `origTc` OR `destTc`
         matches exactly (substring match would let 利安 swallow
         利安山). GMB / LRT / MTR are excluded — they enumerate stops
         per-route rather than at bus-stop level.
       - Terminology: this is a "terminus" scan only — it catches
         routes that *terminate* at the stop. Via-stops (routes that
         pass through without terminating) still won't appear.
       - Real-world case: opening "#/stop/MA973" (利安巴士總站) at
         11:31 AM previously showed only 680 + 87K (the two routes
         with an imminent bus). KMB's static route index lists 5
         distinct routes terminating at 利安: 680, 86C, 87K, 87P,
         286C. With the terminus scan, all 5 appear: 680 with live
         ETAs, the other 4 as dimmed `.route-card--no-eta` cards.
       - Existing groupBy loop runs first; live-ETA cards are
         unaffected. Terminus scan only inserts entries that aren't
         already in `routeMap`, so a route returned by upstream is
         never double-counted.
       - The scan uses `state._lastStopName` (resolved TC name stored
         by `renderBusStopView`) with a fallback to local-index
         `nameTc`. If both are empty, the scan is skipped to avoid
         false positives.
       - TODO(v38): build a true `routesByStop` map at index time by
         querying `/route-stop/{route}/{dir}/{service}` for every
         route so via-stops also show up.
       - SW bumped buseta-v24 → buseta-v25 to force a clean install.
       - index.html cache-buster ?v=36 → ?v=37 on app.js (style.css
         unchanged — no CSS shipped this round), meta
         name="buseta-version" content="36" → "37".

     v=38 ships "disruption banner freshness" on top of v=37:
       - app.js: new helper isDisruptionExpired(it) — returns true
         when it.until (YYYY-MM-DD, HK end-of-day) is strictly before
         today in HK time. Items without an `until` field are treated
         as indefinite and never expire via this check. Unparseable
         values fall through to false so a typo doesn't hide a real
         alert. disruptionsForUserRoutes() now applies this filter
         before the user-route match, so the banner stops pinning
         expired entries like the v37-era snapshot's KMB 914X
         (until 2026-10-03), CTB 8 (until 2026-10-04), KMB 968
         (until 2026-10-04). Items without until (e.g. "A11 extra
         service until further notice", "route 11 suspended") stay
         visible.
       - sw.js: SWR-style 6h freshness window for assets/disruptions.
         json specifically. New constant DISRUPTION_MAX_AGE_MS = 6h
         alongside ETA_MAX_AGE_MS = 5min. etaSWR() generalised to
         take a maxAgeMs argument (default = ETA_MAX_AGE_MS for
         backwards compat) and reused for the disruption file.
         Dedicated fetch-handler branch added before the generic
         /assets/*.json cache-first path. The fresh-vs-stale
         decision reads x-sw-cached-at set by timestampedResponse;
         old plain cache.put() entries lack that header so the first
         request after upgrade falls through to network and rewrites
         the entry — no migration needed. ASSET_CACHE for other
         assets (hk-stops.json, route shapes, ...) is unchanged —
         those files change rarely and are large.
       - SW bumped buseta-v25 → buseta-v26 to force a clean install.
       - index.html cache-buster ?v=37 → ?v=38 on app.js (style.css
         unchanged — no CSS shipped this round), meta
         name="buseta-version" content="37" → "38".

     v=39 ships "hide the disruption banner" on top of v=38:
       - app.js: fetchDisruptions() now short-circuits to Promise.
         resolve([]) — neither fetches assets/disruptions.json nor
         caches anything. renderDisruptionBanner() already returns
         null on an empty array, so the banner DOM is never built and
         never inserted into the home view. The curated JSON stays
         on disk and the rest of the pipeline (disruptionForRoute,
         disruptionTitleFor, disruptionUntil, renderDisruptionBanner)
         stays in place — restoring the banner is a one-line revert
         (delete the short-circuit).
       - Rationale (audit Oct 2026): the snapshot is hand-authored
         content with no upstream source — every plausible KMB/CTB
         open-data path returns 422/404. Surfacing stale hand-
         curated alerts as a "live" 服務通知 banner is misleading;
         better to hide until a real feed exists.
       - sw.js: bumped buseta-v26 → buseta-v27 to force a clean
         install. The disruption-specific SWR branch (6h TTL) stays
         in place for the same one-line-revert reason.
       - index.html cache-buster ?v=38 → ?v=39 on app.js (style.css
         unchanged — banner styles are now dead CSS but harmless),
         meta name="buseta-version" content="38" → "39".

     v=40 ships "TD XML feed wire-up" on top of v=39:
       - app.js: fetchDisruptions() now actually fetches — the
         Transport Department's public-data XML feed at
         https://www.td.gov.hk/datagovhk_tis/traffic-notices/Notices_on_Public_Transports.xml
         was missed by the original v37-era audit (the v37 hand-
         audit only probed operator open-data endpoints). DOMParser
         walks every <Notice> in the ~3.5 MB feed, projects each into
         one banner item per affected route. New module-scope helpers
         placed right before fetchDisruptions(): parseTdDate(s)
         (DD.MM.YYYY → YYYY-MM-DD), hktToday() (HK-local date as
         YYYY-MM-DD), classifyOperator(titleTc, titleEn) → 'KMB' |
         'LWB' | 'CTB' | 'NWFB' | 'GMB' | 'MTR' | 'LRT' | null,
         extractRouteNumbers(titleTc, titleEn) (CN regex on
         第...號/號線 plus EN regex on Route No(s).), and
         classifySeverity(titleTc, titleEn, contentTc, contentEn)
         → 'severe' | 'warn' | 'info'. Cross-check on route
         numbers is implicit (Set merge of CN + EN).
       - Filter pipeline: drop notices with StartEffectiveDate older
         than today-30d, drop ones with no parseable route number
         (area-wide bus-stop relocations don't fit the per-route
         banner shape), expand multi-route notices into one item
         per route. Output shape — { co?, route, severity,
         titleTc, titleEn, titleSc, until } — is unchanged so
         disruptionsForUserRoutes() + renderDisruptionBanner()
         work without modification. Per-route `until` falls back
         to StartEffectiveDate + 30d (no EndEffectiveDate in the
         feed today — audit: 0/536 records carry one). Cached
         disruptionsCache = p so repeat calls in the same session
         are O(1); parse failures cache [] so we don't retry every
         mount.
       - Revert path: assets/disruptions.json stays on disk, and
         the v39 short-circuit is gone but easy to put back —
         delete the TD pipeline body in fetchDisruptions() and
         replace with `const p = Promise.resolve([]);
         disruptionsCache = p; return p;`. Restoring = one
         deleted block.
       - sw.js: new dedicated cross-origin fetch branch BEFORE the
         generic same-origin /assets/*.json path. Constant
         TD_DISRUPTION_URL + TD_DISRUPTION_MAX_AGE_MS = 24h (the
         feed is daily-updated). New bucket TD_DISRUPTION_CACHE =
         'buseta-td-disruptions-v1'. Freshness check on
         x-sw-cached-at (set by timestampedResponse); cached
         entries lacking that header (none today — this is a fresh
         bucket) fall through to the network on first request and
         get rewritten. Background revalidate with If-Modified-
         Since passes the cached Last-Modified so the server only
         sends a fresh body when the feed actually changed; 304
         returns the still-fresh cached body.
       - sw.js: CACHE bumped buseta-v27 → buseta-v28 (forces clean
         install). activate-handler keep-list updated to also keep
         TD_DISRUPTION_CACHE so the cached entry survives the
         upgrade.
       - index.html cache-buster ?v=39 → ?v=40 on app.js (style.css
         unchanged — no CSS shipped this round), meta
         name="buseta-version" content="39" → "40".

     v=41 ships "Trip planner route strategies (Bus / Rail / Mixed)"
     on top of v=40:
       - planner.js: search() now captures three parallel feeds so
         each strategy is genuinely different routing rather than
         a re-ranking of one merged bucket.
           * busDirect / busOneTransfer / busTwoTransfer = the
             output of findDirect / findOneTransfer / findTwoTransfer
             BEFORE the rail merge (lines 1412–1419 in v40).
           * railDirect / railOneTransfer = findMtrRoutes +
             findLrtRoutes BEFORE the rail merge too.
           * direct / oneTransfer / twoTransfer = the legacy merged
             buckets, unchanged from v40 so external callers see the
             same shape.
         New STRATEGY_LIMIT = 2 tunable next to DIRECT_LIMIT.
         New module-scope strategyOf(j) helper classifies each
         journey by ride-leg mode composition (KMB / LWB / CTB /
         NWFB / GMB → bus; MTR / LRT → rail; both → mixed; pure
         walk → mixed fallback for a future findWalk feature).
         Buckets bus / rail / mixed are sorted by totalMin and
         sliced to STRATEGY_LIMIT; result gains a `strategies`
         field with `{ bus, rail, mixed }` each holding
         `{ journeys, best }`.
       - planner.js: renderPlanner() swaps the three
         direct / 1-hop / 2-hop sections for three coloured
         STRATEGY_LABELS sections (Bus → accent orange, Rail →
         accent-2 red, Mixed → muted indigo). Sections with
         zero journeys are silently absent. Strategy tag
         badge next to the rank-1 chip uses the new
         .planner-strategy-tag class (orange / red / indigo
         gradients) so each card identifies its strategy at a
         glance.
       - planner.js: patchPlannerStrings() extended with three
         new section-title keys (plannerStrategyBus / Rail /
         Mixed) and three short tag-label keys (plannerStrategy
         TagBus / TagRail / TagMixed) × three locales = 18 new
         string entries. Zero edits to app.js (matches the v37
         planner convention).
       - planner.css: new .planner-strategy-tag + .is-bus /
         .is-rail / .is-mixed variants. ≤ 20 LOC delta. No new
         theme tokens; colours re-use the existing palette.
       - index.html cache-busters: meta name="buseta-version"
         content="40" → "41", app.js?v=40 → app.js?v=41,
         planner.js?v=15 → planner.js?v=16, planner.css?v=15
         → planner.css?v=16.

     v=42 ships "Trip planner — fix 乘車0m + route-shape canvas + km
     summary" on top of v=41:
       - planner.js: 乘車0m bug fix. railRoute() now looks up
         `fromStop` / `toStop` in the rail graph's reverseIdx and
         computes meters via haversine between consecutive stations,
         so MTR / LRT ride legs report real km instead of 0. The merge
         loop that combines consecutive single-station rides on the
         same line now sums meters across legs (was: first leg's
         meters only). LRT stops fall back to 0 because
         `state.index.lrt.stops` doesn't carry lat/lng today (no
         curated LRT stops table shipped with the app) — TODO marked
         for v42.x if anyone asks.
       - planner.js: inline-SVG route-shape canvas on every journey
         card. New buildJourneyCanvas() collects from/to lat/lng
         across ride legs via the existing stopLatLng(), bounds them
         into a 120×80 SVG with 8 px padding, draws one `<line>` per
         ride leg coloured by operator (reuses the existing
         .planner-chip.co-X palette) plus origin (green) and
         destination (red) dots. Walking segments omitted by design
         so the canvas focuses on the ride shape.
       - planner.js: summary card now surfaces `X.X km` beside the
         best-journey's minutes. Walks + rides summed via the existing
         journey.legs meters (no new calculation — the data was
         already there, just never displayed).
       - planner.js: extended console.log line now reports
         `cov=N empty=0|1` — cov = number of strategies (bus / rail /
         mixed) that produced ≥1 journey; empty = 1 iff the user got
         the no-results state. Lets us track per-query strategy
         coverage across a session without adding a UI surface.
       - planner.css: new .planner-card-canvas + .planner-canvas-line
         + .planner-canvas-dot (origin / dest) classes. ~40 LOC delta,
         all colour values re-used from the existing chip palette so

       - index.html cache-busters: meta name="buseta-version"

     v=43 ships "Trip planner — short-circuit bus searches on pure-rail
     queries" on top of v=42:

         MTR / LRT stations and replaces the three bus sub-planners

     v=47 ships "real walking paths + walk-time on every card" on
     top of v46's planner. Two follow-ups from the Google Maps
     discussion, done with NO API key:
       - planner.js fetchRealWalkRoute() queries the public GraphHopper
         demo at routing.openstreetmap.de/routed-foot/route/v1/foot/
         for a real pedestrian route — duration, distance, and a
         GeoJSON LineString. Verified TSW→CEN returns 14.9 km / 193 min
         / 916 waypoints in ~250 ms. Cached in _walkRouteCache keyed
         by rounded coords (~1 m precision) so back-to-back searches
         don't hammer the demo. On any failure we fall back to the
         existing flat 60 m/min haversine walkMinutes() so the planner
         still works offline.
       - walkLeg() wraps fetchRealWalkRoute + the haversine fallback so
         every router (findDirect, findOneTransfer, findTwoTransfer,
         railRoute) is one line: `const w = await walkLeg(...)`.
         Walk legs now carry `geometry` and `routed` so the canvas can
         draw the real footpath.
       - buildJourneyCanvas draws the routed walk as a dashed polyline
         through the geometry coords (downsampled to ~32 segments for
         very long paths). The dashed corner-anchor fallback from v44
         still fires for unrouted legs so the visual stays consistent
         when GraphHopper is unreachable.
       - Card meta row now reads "步行 0.3 km · 約 4 分鐘" instead of
         just distance. Legs strip shows walk minutes alongside
         distance for the same reason. New i18n key
         `plannerWalkMinPrefix` (約 / ~ / 约) localised for all three
         locales.
       - planner.css .planner-canvas-walk-routed picks up a heavier
         accent-coloured dashed stroke (var(--accent) at 1.8 / 0.85
         opacity) so users can tell the routed walk from the
         corner-anchor fallback at a glance.
       - index.html cache-busters: meta name="buseta-version"
         content="46" → "47", planner.js?v=22 → planner.js?v=23,
         planner.css?v=22 → planner.css?v=23. app.js not touched

     bus-stop lookup that actually lets mixed (bus+rail) journeys
     surface for the canonical cross-mode cases like MA309 → KT924.
     The previous v52 / v52.1 fixes made the code structurally correct
     but the mixed bucket was still empty because findDirect() iterates
     each candidate route's stop list and does an exact `s.stop === dest.stop`
     match. MTR station codes (3-letter like 'MOS', 'KWT', 'HOK') and LRT
     codes never appear in a bus route's stop list — KMB uses 16-hex
     internal IDs, CTB uses 6-digit, GMB uses numeric. So calling
     findDirect(MA309 → MOS) returned [], even though KMB 89K
     physically serves a stop 5 m from Ma On Shan MTR Station.

         to the existing findNearestMtrStop / findNearestLrtStop. Scans
         idx.stops filtered to bus operators (KMB / LWB / CTB / NWFB /
         GMB), returns the closest within maxMeters (we use 500 m to
         match the existing TRANSFER_WALK_LIMIT_M). Cached by rounded
         lat/lng so the same station hit twice in one search reuses
         the result.

         nearest bus stop first, then pass that to findDirect. The
         splicer adds the remaining walk from the bus alighting stop to
         the actual rail station as a tail leg in the newLegs array, so
         the resulting journey is physically continuous:

         + bus ride + walk-to-destination.

     audit caught two latent bugs that prevented the "mixed bus+rail"
     bucket from ever showing up in the UI for cross-mode cases:
       - findDirect ride leg was missing routeMeta (planner.js:803).
         strategyOf() checks `leg.routeMeta.co` to classify a leg as
         bus vs. rail. Without it the leg is skipped and the journey
         falls through to the 'mixed' default. For a pure-bus findDirect
         journey this is cosmetic; for a spliced buildMixedJourneys
         candidate it caused the rail legs to win the strategyOf vote
         and the journey to land in the "rail" section instead of the
         "mixed" section. One-line fix: add `routeMeta: meta` to the
         ride leg.
       - buildMixedJourneys splice assumed `legs[0]` was the walkOut.
         For pure-rail that holds (railRoute prepends walkOut), but
         findMtrRoutes / findLrtRoutes append the cross-mode walks at
         the END of rj.legs so the order is [ride, walkOut, walkIn].
         The old `if (legs[0].kind === 'walk' && legs[0].from === 'origin')`
         guard never fired in cross-mode cases and the splice silently
         fell through to the unchanged rail journey. Rewrite the inner
         loop to locate walkOut / walkIn by label (legs.find instead of
         legs[0]) and rebuild the journey in logical order
         [preBus | walkOut, ride(s), walkIn | postBus]. The walkIn label
         is now matched on `l.to === 'dest' || l.to === dest.stop` so
         both pureRail (`to='dest'`) and cross-mode (`to=KT924`) work.

     — after v51's conservative loosening, MA309 → KT924 still only
     surfaced the rail cross-mode option because the pure-bus BFS
     couldn't find any KMB↔KMB transfer. Realistic end-to-end options
     for cross-region trips almost always mix bus (last-mile to a
     rail station) with rail (the trunk) and bus again (last-mile
     from the destination station). v52 builds those.
       - New buildMixedJourneys() in planner.js. For each rail
         journey (MTR or LRT), it tries to find a direct bus from
         the user's origin to the first ride leg's rail entry
         station, and/or from the last ride leg's rail exit
         station to the user's destination. When either exists,
         the bus legs are spliced in place of the cross-mode walks
         (or prepended/appended for pure-rail journeys where the
         origin / destination is the rail station but a bus also
         serves it). The resulting journey has both bus and rail
         legs, so strategyOf() correctly buckets it as "mixed".

    <script>
      /* Theme loader — runs synchronously in <head> so :root[data-theme] is set
   BEFORE the body paints. Mirrors the loadThemePreference() logic in app.js
   but does not need to wait for app.js to download/execute. Without this,
   a light-mode returning visitor would see a dark first-paint flash. */
      (function () {
        try {
          var stored = localStorage.getItem('buseta.theme');
          var mode =
            stored === 'dark' || stored === 'light' || stored === 'system' ? stored : 'system';
          if (mode === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
          } else if (mode === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
          /* If mode === 'system' or no value at all, leave the data-theme
       attribute unset so prefers-color-scheme drives the choice. The :root
       defaults are dark, so first-time visitors with no preference
       (or no system support) get dark as the fallback. */
          var btn = document.getElementById('themeToggle');
          if (btn) btn.setAttribute('data-mode', mode);
        } catch (e) {
          /* localStorage unavailable — fall back to dark */
        }
      })();

    <script>
      /* Lazy planner loader — planner.js + planner.min.css are only fetched the
   first time the user navigates to #/planner. They are cached at the
   module level so subsequent navigations don't refetch. */
      window.__buseta = {
        _plannerScript: null,
        _plannerCss: null,
        loadPlannerScript() {
          if (window.Planner) return Promise.resolve(window.Planner);
          if (this._plannerScript) return this._plannerScript;
          this._plannerScript = new Promise((resolve, reject) => {
            const s = document.createElement('script');
            s.src = 'planner.js?v=38';
            s.async = false; // preserve execution order
            s.onload = () => resolve(window.Planner);
            s.onerror = () => reject(new Error('planner.js failed to load'));
            document.head.appendChild(s);
          });
          return this._plannerScript;
        },
        loadPlannerCss() {
          if (document.querySelector('link[data-planner-css]')) return Promise.resolve();
          if (this._plannerCss) return this._plannerCss;
          this._plannerCss = new Promise((resolve, reject) => {
            const l = document.createElement('link');
            l.rel = 'stylesheet';
            l.href = 'planner.css?v=38';
            l.setAttribute('data-planner-css', '1');
            l.media = 'print';
            l.onload = () => {
              l.media = 'all';
              resolve();
            };
            l.onerror = () => reject(new Error('planner.css failed to load'));
            document.head.appendChild(l);
          });
          return this._plannerCss;
        },
      };
    </script>
    <!-- Shared utilities — must load BEFORE app.js so busetaUtils.* is
         populated on globalThis when app.js evaluates. Each file attaches
         its exports to globalThis.busetaUtils via the bottom-of-file
         side effect. Source-of-truth ES modules live in src/utils/*.js
         and are exercised by Vitest. -->
    <script src="src/utils/geo.js?v=1"></script>
    <script src="src/utils/time.js?v=1"></script>
    <script src="src/utils/date.js?v=1"></script>
    <script src="src/utils/disruptions.js?v=1"></script>
    <script src="src/utils/disruption-classify.js?v=1"></script>
    <script src="src/utils/network.js?v=1"></script>
    <script src="src/utils/operators.js?v=1"></script>
    <script src="src/utils/text.js?v=1"></script>
    <script src="src/utils/routes-by-stop.js?v=1"></script>
    <script src="src/utils/concurrency.js?v=1"></script>
    <script defer src="app.js?v=55"></script>
    <script>
      // SW path must be RELATIVE — GitHub Pages serves this site under
      // /buseta-hk/ but a leading `/sw.js` would resolve to the site root
      // (https://rollroyces.github.io/sw.js, which 404s). `./sw.js` keeps
      // the registration scoped to wherever the page is hosted, so the
      // same build works on GitHub Pages project sites AND root domains
      // AND localhost previews. `updateViaCache: 'none'` forces the
      // browser to re-fetch sw.js on each update check so cache-buster
      // bumps take effect within one navigation.
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('./sw.js?v=43', { updateViaCache: 'none' })
            .then((reg) => {
              // SR-7 · Offline-mode onboarding. After a successful SW install
              // (first time only), tell the user the app can now be used offline.
              // We fire the toast when the very first install completes — that
              // way the user knows about the offline capability. The flag is
              // stored under a dedicated key so the toast never repeats.
              const swFlag = 'buseta.swOnboarded';
              try {
                if (!localStorage.getItem(swFlag)) {
                  const seen = reg.installing || reg.waiting || reg.active;
                  const watch = (sw) => {
                    if (!sw) return;
                    const done = () => {
                      if (sw.state === 'activated' && !localStorage.getItem(swFlag)) {
                        try {
                          localStorage.setItem(swFlag, '1');
                        } catch {}
                        if (typeof window.__busetaToast === 'function') {
                          window.__busetaToast(
                            '離線可用：常用路線會自動快取，無網絡時仍可查詢。',
                            5000
                          );
                        }
                      }
                    };
                    sw.addEventListener('statechange', done);
                    if (sw.state === 'activated') done();
                  };
                  watch(seen);
                }
              } catch {
                /* localStorage unavailable */
              }
            })
            .catch((err) => {
              console.warn('Service worker registration failed:', err);
            });
        });
      }
    </script>
